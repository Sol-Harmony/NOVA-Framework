; Copy this file to config.ini and fill it in. config.ini is NOT in git: it differs for every server.
; Use quotes around values that contain special characters (passwords!).

[app]
; 1 = show errors in the browser (only on your own computer!), 0 or missing = visitors only see a generic error page.
; the details always go to storage/logs/php-error.log
debug = 0

[database]
; only needed when the website uses a database (a model that extends BaseModel)
servername = "localhost"
username = ""
password = ""
database = ""

[mail]
; the contact form sends its messages to "to". If "host" is empty PHP's mail() is used, which many hosters
; deliver badly or not at all, so use the SMTP data of the client's mailbox.
to           = "info@example.com"
from_address = "info@example.com"
host         = ""
; port 587 with encryption = tls, or port 465 with encryption = ssl
port         = 587
encryption   = tls
username     = ""
password     = ""

[security]
; only behind a proxy or CDN. Name of the header that holds the real address of the visitor, e.g. HTTP_CF_CONNECTING_IP for Cloudflare.
; Never set this without a proxy, visitors could fake the address.
; proxy_header = "HTTP_CF_CONNECTING_IP"
; 1 (default) = the contact form allows 5 messages per hour and visitor. For that a keyed hash of the visitor's IP address is kept
; for 24 hours. 0 = no IP address is processed by the website at all, only the overall limit (100 messages per hour) stays.
; The privacy policy changes with this setting by itself.
; limit_by_ip = 1
; 1 = believe X-Forwarded-Proto (only when a proxy terminates https for you)
; trust_proxy = 0
